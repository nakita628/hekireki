# The two databases test/db/seed.test.ts runs against. `docker compose -f test/db/compose.yaml up -d`,
# then export the URLs the test reads:
#
#   HEKIREKI_SEED_PG=postgresql://postgres:postgres@localhost:5432/seed
#   HEKIREKI_SEED_MYSQL=mysql://root:root@localhost:3306/seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seed
    ports:
      - '5432:5432'
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seed
    ports:
      - '3306:3306'
