      required:
        - id
        - userId
        - bio
        - nickname
        - age
        - balance
        - verified
        - meta
        - avatar
        - lastSeen
      description: |-
        One-to-one relation with native @db.* types, literal defaults,
        and optional scalars of every flavour. ConfigDict passthrough: the
        Pydantic model rejects unknown keys (extra='forbid').
    ProfileCreate:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bio:
          type: [string, "null"]
        nickname:
          type: string
        age:
          type: [integer, "null"]
        balance:
