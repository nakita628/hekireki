components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: Primary key (UUIDv7)
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
        interests:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - interests
        - createdAt
        - updatedAt
      description: |-
        Application user. Fully annotated for every validator generator,
        with a UUIDv7 primary key, enum default, scalar list, @map columns,
        @updatedAt, and relations of every cardinality.
    UserCreate:
      type: object
      properties:
        id:
          type: string
          description: Primary key (UUIDv7)
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
        interests:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - email
        - name
    UserUpdate:
      type: object
      properties:
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
        interests:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile:
      type: object
