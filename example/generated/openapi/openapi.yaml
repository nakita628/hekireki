components:
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          description: Primary key (UUIDv7)
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
          default: "VIEWER"
        interests:
          type: [array, "null"]
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - created_at
        - updated_at
      description: |
        Application user. Fully annotated for every validator generator,
        with a UUIDv7 primary key, enum default, scalar list, @map columns,
        @updatedAt, and relations of every cardinality.
    users_create:
      type: object
      properties:
        id:
          type: string
          description: Primary key (UUIDv7)
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
          default: "VIEWER"
        interests:
          type: [array, "null"]
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - email
        - name
    users_update:
      type: object
      properties:
        id:
          type: string
          description: Primary key (UUIDv7)
        email:
          type: string
          description: Unique login email
        name:
          type: string
          description: Display name
        role:
          type: string
          enum:
            - ADMIN
            - EDITOR
            - VIEWER
          default: "VIEWER"
        interests:
          type: [array, "null"]
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        bio:
          type: [string, "null"]
        nickname:
          type: string
          default: "anonymous"
        age:
          type: [integer, "null"]
        balance:
          type: string
          default: 0
        verified:
          type: boolean
          default: false
        meta:
          type: [string, "null"]
        avatar:
          type: [string, "null"]
        last_seen:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - user_id
        - nickname
        - balance
        - verified
      description: |
        One-to-one relation with native @db.* types, literal defaults,
        and optional scalars of every flavour. ConfigDict passthrough: the
        Pydantic model rejects unknown keys (extra='forbid').
