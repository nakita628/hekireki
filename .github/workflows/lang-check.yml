name: Lang Check

# Validity checks for hekireki's generated foreign-language code: each language
# is generated from test/schema.prisma and then checked in its own toolchain —
# it parses (syntax) and compiles or loads against the real GORM / sea-orm /
# SQLAlchemy / Ecto / Active Record / Eloquent API (type). This is separate
# from Test (test.yml), which owns the byte-equality codegen contract and stays
# toolchain-free.
#
# One matrix leg per language; each sets up only its own toolchain. Runs on PRs
# that touch the generators or the harness, and on demand. Action versions are
# tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  pull_request:
    paths:
      # All of src/ — the generators' entrypoints (src/bin) and shared codegen
      # layers (utils/emit/format/fsp) affect generated output too; a false
      # positive here is a cheap matrix run, a false negative is an unverified
      # generator change.
      - packages/hekireki/src/**
      - test/**
      - .github/workflows/lang-check.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lang-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lang:
    runs-on: ubuntu-latest
    # Backstop against toolchain prompts hanging a leg (mix once blocked on a
    # rebar3 install prompt); the default job timeout is 6 hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # drizzle needs no extra toolchain step: setup-vp's node runs
        # tsc + drizzle-kit from the workspace's devDependencies.
        lang: [gorm, sea-orm, sqlalchemy, ecto, drizzle, activerecord, eloquent, atlas]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - run: vp run hekireki#build

      - if: matrix.lang == 'gorm'
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.23.6'
      - if: matrix.lang == 'sqlalchemy'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.4'
      - if: matrix.lang == 'sea-orm'
        uses: actions-rust-lang/setup-rust-toolchain@v1.13.0
        with:
          # Locked crates (zeroize 1.9+) use edition2024, which needs
          # cargo >= 1.85 just to parse their manifests.
          toolchain: '1.96.0'
          components: rustfmt
      - if: matrix.lang == 'ecto'
        uses: erlef/setup-beam@v1.20.4
        with:
          otp-version: '27.2'
          elixir-version: '1.18.1'
          # Pinned so the harness's `mix local.rebar --if-missing` never falls
          # back to an unpinned network fetch of the rebar3 escript.
          rebar3-version: '3.24.0'
      - if: matrix.lang == 'activerecord'
        uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: '3.3.12'
          # Installs the harness bundle from its Gemfile.lock and caches
          # vendor/bundle; the test's own `bundle install` becomes a no-op.
          bundler-cache: true
          working-directory: test/harness/activerecord
      - if: matrix.lang == 'eloquent'
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
      # The atlas leg also uses the runner's Docker daemon: the test validates
      # the generated HCL against a disposable postgres dev database via
      # Atlas's docker:// dev-url. The CLI version is pinned: the action's
      # installer ships no checksum verification, so floating `latest` would
      # reinstall an unvetted binary on every run.
      - if: matrix.lang == 'atlas'
        uses: ariga/setup-atlas@v0.3
        with:
          version: v1.3.0

      # The `test` package regenerates harness/* from schema.prisma in its
      # globalSetup, then runs this language's checks. The same file runs
      # locally via `pnpm lang`. CI is set on GitHub Actions, which turns each
      # file's toolchain guard into a hard assertion — a leg whose setup step
      # silently failed cannot pass by skipping.
      - name: Lang check (generate + syntax + type check)
        run: vp run --filter ./test test lang/${{ matrix.lang }}.test.ts

  # Prove the published tarball still ships dist/ only. The language harnesses
  # now live in test/ rather than inside the package, so nothing under
  # packages/hekireki can leak them — this stays as the standing guard.
  pack-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hekireki
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '22'
          cache: true
      - run: vp install
        working-directory: .
      - run: vp run hekireki#build
        working-directory: .
      - name: Assert tarball contains dist/ only
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path)
            const leaked = files.filter((p) => !/^(dist\/|package\.json$|README|LICENSE)/.test(p))
            if (leaked.length) { console.error("tarball leaks non-dist files:\n" + leaked.join("\n")); process.exit(1) }
            console.log("ok: tarball ships dist/ only (" + files.length + " files)")
          '
