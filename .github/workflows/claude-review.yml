name: Claude Review

# Claude reviews every pull request from a branch of this repository and the job ends in a
# verdict: an approving review, or a review requesting changes and a failed check. Making this
# check and one approval required on main is what lets the auto-merge that Claude Implement
# (claude-implement.yml) turns on actually merge; a pull request opened by hand merges only when
# someone turns auto-merge on or presses the button.
#
# Claude reaches the API through workload identity federation, trading the job's OIDC token for a
# short-lived token, so no credential is stored. The review is posted with GITHUB_TOKEN as
# github-actions[bot], which is never the author of the pull request, so the approval counts. That
# needs "Allow GitHub Actions to create and approve pull requests" under Settings → Actions →
# General. A pull request from a fork is skipped, and someone with write access reviews it.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Identifiers of the Claude Console's workload identity federation (Settings → Workload identity),
# not credentials. Duplicated in claude-implement.yml.
env:
  ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_REPLACE_ME
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_REPLACE_ME

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # What Claude Implement must not do, held without asking a model: a branch it pushed may
      # not touch .github/ or change a package's version, since a version bump on main publishes.
      - name: Guard a Claude branch
        if: startsWith(github.head_ref, 'claude/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE"...HEAD)
          if grep -E '^\.github/' <<< "$changed"; then
            echo "::error::A claude/ branch changed .github/"
            exit 1
          fi
          for file in $(grep -E '(^|/)package\.json$' <<< "$changed" || true); do
            before=$(git show "$BASE:$file" 2>/dev/null | jq -r .version || echo null)
            if [ "$before" != "$(jq -r .version "$file")" ]; then
              echo "::error::A claude/ branch changed the version in $file"
              exit 1
            fi
          done

      - name: Review the pull request
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          github_token: ${{ github.token }}
          # The pull requests Claude Implement opens come from the Claude GitHub App, and
          # Renovate's from its own; a bot reaches this job only by pushing a branch here, which
          # takes write access.
          allowed_bots: '*'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The head branch is checked out in the working directory;
            read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the description
            with `gh pr view ${{ github.event.pull_request.number }}`.

            Look for correctness bugs, regressions in generated output, security problems, and
            breaks of the rules in CONTRIBUTING.md. Test, Lint, E2E and Lang Check run as separate
            workflows, so do not run them and do not report what they catch (formatting, lint,
            spelling). A change to the `version` of a package.json publishes to npm when merged:
            request changes unless the description says the release is intended.

            Post each concrete problem as an inline comment with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).

            Answer with:
            - `approve`: true when nothing you found should block the merge, false otherwise.
            - `summary`: the review body: the verdict in one sentence, then the blocking problems
              (if any), each in a line.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"approve":{"type":"boolean"},"summary":{"type":"string"}},"required":["approve","summary"]}'

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          jq -r .summary <<< "$OUTPUT" > "$RUNNER_TEMP/review.md"
          if [ "$(jq -r .approve <<< "$OUTPUT")" = "true" ]; then
            gh pr review "$PR" --approve --body-file "$RUNNER_TEMP/review.md"
          else
            gh pr review "$PR" --request-changes --body-file "$RUNNER_TEMP/review.md"
            echo "::error::Claude requested changes"
            exit 1
          fi
