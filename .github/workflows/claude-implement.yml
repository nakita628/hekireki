name: Claude Implement

# An issue labelled `claude` becomes a pull request: Claude reads the issue, changes the code, runs
# the checks, pushes a branch and opens the pull request with auto-merge turned on. Claude Review
# (claude-review.yml) and the other required checks then decide whether it merges.
#
# No stored credential is involved. The action trades the job's GitHub OIDC token twice: with
# Anthropic, through the workload identity federation rule below, for a short-lived Claude API
# token; and with the Claude GitHub App (https://github.com/apps/claude, installed on this
# repository) for a short-lived installation token, revoked when the step ends. The pull request
# has to be opened with that App token rather than GITHUB_TOKEN: GitHub starts no workflow for
# events GITHUB_TOKEN causes, so Test, Lint and Claude Review would never run on it, and the merge
# would not start release.yml. The App has no `workflows` permission, so Claude cannot push a
# change to .github/workflows; Claude Review fails a `claude/` branch that changes a version.
#
# Only someone with triage access or more can add a label, so the label is the gate that keeps a
# stranger's issue from spending the API budget or steering Claude.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

# Identifiers of the Claude Console's workload identity federation (Settings → Workload identity),
# not credentials. Duplicated in claude-review.yml.
env:
  ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_REPLACE_ME
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_REPLACE_ME

jobs:
  implement:
    if: github.event.label.name == 'claude' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      # Both token exchanges above start from the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      - name: Implement the issue
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Read the issue and its comments with `gh issue view ${{ github.event.issue.number }} --comments`
            and implement it. The working directory is a checkout of main.

            1. Follow CONTRIBUTING.md: run `pnpm check` and `pnpm test` from the repository root,
               and `pnpm example` when a generator's output changes, and fix what they report.
               Keep the change to what the issue asks for.
            2. Do not change `.github/`, and do not change the `version` in any package.json:
               a version bump on main publishes to npm.
            3. Create the branch `claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}`, commit with
               a message `type(scope): summary` as in .github/pull_request_template.md, ending with
               `Closes #${{ github.event.issue.number }}`, and push it to origin.
            4. Open the pull request against main with `gh pr create --label claude`. Its title is the
               commit's subject, and its body fills the sections of
               .github/pull_request_template.md, with `Closes #${{ github.event.issue.number }}` under Why, only
               the checks you actually ran ticked, and a last line
               `🤖 Generated with [Claude Code](https://claude.com/claude-code)`.
            5. Turn on auto-merge with `gh pr merge <number> --auto --squash`. Never merge in any
               other way.

            If the issue is unclear or should not be done, change nothing and explain why with
            `gh issue comment ${{ github.event.issue.number }}`.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm:*),Bash(vp:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr merge:*)"

      - name: Report a failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Claude Implement failed: $RUN_URL"
