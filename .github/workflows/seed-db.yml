name: Seed DB

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# `hekireki seed` against real PostgreSQL and MySQL servers: the rows Prisma's own `db push`
# tables accept, the foreign keys they enforce, the sequences, and the SQL script variant. And the
# Prisma Client page of `hekireki studio` on the same servers: calls run through a generated
# client and the adapter of the dialect, with the statements Prisma Client sent.
jobs:
  seed-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: seed
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HEKIREKI_SEED_PG: postgresql://postgres:postgres@localhost:5432/seed
      HEKIREKI_SEED_MYSQL: mysql://root:root@localhost:3306/seed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run hekireki#build

      - run: vp run --filter ./test test db/seed.test.ts db/studio-client.test.ts
