name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # release-please.yml starts it on main after merging the version bump, which, merged with the
  # workflow's token, starts nothing else; release.yml publishes once it passes.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A libSQL server, what Turso runs: src/database/driver.test.ts runs the libSQL driver against
    # the one HEKIREKI_LIBSQL_URL names (and skips it without). Pinned like the images of
    # seed-db.yml; move the tag with @libsql/client in the root package.json.
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.33
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run hekireki#build

      - run: vp link ./packages/hekireki

      # The format, oxlint and type checks of every workspace. `pnpm lint` (Markdown, spelling,
      # links, workflows, Knip) is the Lint workflow's, and is not run twice.
      - run: vp run check:code

      # packages/hekireki only: the `test` package needs the Go / Rust / Python /
      # Elixir / Ruby / PHP toolchains and is owned by the Lang Check matrix. The coverage
      # thresholds in packages/hekireki/vite.config.ts fail the run when coverage drops.
      - run: vp run --filter ./packages/hekireki coverage
        env:
          HEKIREKI_LIBSQL_URL: http://127.0.0.1:8080

      # examples/migrate end to end on SQLite: the check, the migration Prisma wrote rewritten by
      # `hekireki migrate plan --migration`, `prisma migrate deploy`, and no difference left
      # between the database and the schema.
      - run: vp run --filter ./examples/migrate demo
