name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '22'
          cache: true

      - run: vp install

      - run: vp run hekireki#build

      - run: vp link ./packages/hekireki

      - run: vp run -r check

      # packages/hekireki only: the `test` package needs the Go / Rust / Python /
      # Elixir / Ruby / PHP toolchains and is owned by the Lang Check matrix.
      - run: vp run --filter ./packages/hekireki test
