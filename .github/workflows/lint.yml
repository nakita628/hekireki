name: Lint

# The gates that do not need a build: the prose of the repository (markdownlint, textlint, cspell)
# and the workflows themselves (actionlint for the syntax, zizmor for the security posture).
# `pnpm check` runs the same set locally, except zizmor when it is not installed.
#
# Action versions are tracked by Renovate, which pins each one to its digest
# (helpers:pinGitHubActionDigests) and keeps the @vX.Y.Z tag as a comment.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      - run: pnpm lint:md

      - run: pnpm lint:text

      - run: pnpm lint:spell

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # actionlint from npm is the WebAssembly build of the same linter.
      - run: pnpm exec actionlint -ignore 'unexpected key "queue" for "concurrency"'

      # zizmor is a Rust tool published on PyPI; pipx is on the hosted runner. The version is
      # pinned here by hand — it is not an npm dependency, so Renovate does not see it.
      - run: pipx run zizmor==1.30.0 .github/workflows
